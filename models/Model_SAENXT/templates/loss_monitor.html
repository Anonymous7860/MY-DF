<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SAENXT Training Monitor</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    padding: 16px 20px;
    border-bottom: 1px solid rgba(100,150,255,0.15);
    text-align: center;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 600;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.5px;
  }
  .header .subtitle {
    font-size: 11px;
    color: #6b7280;
    margin-top: 2px;
  }

  /* Tab bar */
  .tab-bar {
    display: flex;
    background: #111827;
    border-bottom: 1px solid rgba(100,150,255,0.1);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tab-bar button {
    flex: 1;
    min-width: 0;
    padding: 10px 8px;
    background: none;
    border: none;
    color: #6b7280;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab-bar button.active {
    color: #60a5fa;
    border-bottom-color: #60a5fa;
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Live stats cards */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    padding: 14px 16px;
  }
  .stat-card {
    background: linear-gradient(145deg, #111827, #1f2937);
    border: 1px solid rgba(100,150,255,0.1);
    border-radius: 12px;
    padding: 12px 10px;
    text-align: center;
  }
  .stat-card .label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #6b7280;
    margin-bottom: 4px;
  }
  .stat-card .value {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat-card .delta {
    font-size: 10px;
    margin-top: 2px;
  }
  .src-val { color: #34d399; }
  .dst-val { color: #f59e0b; }
  .iter-val { color: #60a5fa; }
  .delta-good { color: #22c55e; }
  .delta-bad { color: #ef4444; }

  /* Chart */
  .chart-container {
    padding: 10px 16px;
  }
  .chart-box {
    background: linear-gradient(145deg, #111827, #1f2937);
    border: 1px solid rgba(100,150,255,0.1);
    border-radius: 12px;
    padding: 14px;
  }
  .chart-title {
    font-size: 12px;
    font-weight: 600;
    color: #9ca3af;
    margin-bottom: 8px;
  }
  canvas {
    width: 100% !important;
    height: 200px !important;
    border-radius: 8px;
  }

  /* Console */
  .console-container {
    padding: 10px 16px 20px;
  }
  .console-box {
    background: #0d1117;
    border: 1px solid rgba(100,150,255,0.1);
    border-radius: 12px;
    padding: 12px;
    max-height: 250px;
    overflow-y: auto;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 11px;
    line-height: 1.6;
  }
  .console-box .log-line {
    color: #8b949e;
    white-space: nowrap;
  }
  .console-box .log-line .loss-src { color: #34d399; font-weight:600; }
  .console-box .log-line .loss-dst { color: #f59e0b; font-weight:600; }

  /* Status dot */
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #22c55e;
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Rate info */
  .rate-bar {
    display: flex;
    justify-content: space-between;
    padding: 0 16px 6px;
    font-size: 10px;
    color: #6b7280;
  }

  /* Preview section */
  .preview-container {
    padding: 10px 16px 20px;
  }
  .preview-box {
    background: linear-gradient(145deg, #111827, #1f2937);
    border: 1px solid rgba(100,150,255,0.1);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .preview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .preview-title {
    font-size: 12px;
    font-weight: 600;
    color: #9ca3af;
  }
  .preview-view-name {
    font-size: 11px;
    color: #60a5fa;
    font-weight: 500;
  }
  .preview-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    justify-content: center;
  }
  .preview-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid rgba(100,150,255,0.2);
    background: linear-gradient(145deg, #1e293b, #334155);
    color: #e0e0e0;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .preview-btn:active {
    transform: scale(0.96);
    background: linear-gradient(145deg, #334155, #475569);
  }
  .preview-btn.loading {
    opacity: 0.5;
    pointer-events: none;
  }
  .preview-img-wrapper {
    position: relative;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    max-height: 60vh;
    border-radius: 8px;
    background: #0d1117;
  }
  .preview-img-wrapper img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 8px;
    image-rendering: auto;
  }
  .preview-img-wrapper.zoomed img {
    width: auto;
    max-width: none;
  }
  .preview-placeholder {
    padding: 40px 20px;
    color: #4b5563;
    font-size: 13px;
  }
  .preview-placeholder .icon {
    font-size: 32px;
    margin-bottom: 8px;
  }
  .preview-timestamp {
    font-size: 10px;
    color: #4b5563;
    margin-top: 6px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(96,165,250,0.3);
    border-top-color: #60a5fa;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>⚡ SAENXT Training Monitor</h1>
    <div class="subtitle"><span class="status-dot"></span>Live — auto-refreshes every 5s</div>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="active" onclick="switchTab('stats')">📊 Stats</button>
    <button onclick="switchTab('preview')">🖼️ Preview</button>
  </div>

  <!-- Stats Tab -->
  <div id="tab-stats" class="tab-content active">
    <div class="stats">
      <div class="stat-card">
        <div class="label">SRC Loss</div>
        <div class="value src-val" id="src">—</div>
        <div class="delta" id="src-delta"></div>
      </div>
      <div class="stat-card">
        <div class="label">DST Loss</div>
        <div class="value dst-val" id="dst">—</div>
        <div class="delta" id="dst-delta"></div>
      </div>
      <div class="stat-card">
        <div class="label">Iteration</div>
        <div class="value iter-val" id="iter">—</div>
        <div class="delta" id="rate"></div>
      </div>
    </div>

    <div id="save-bar" style="padding:0 16px 8px; display:none;">
      <div style="background:linear-gradient(145deg,#111827,#1f2937); border:1px solid rgba(100,150,255,0.1); border-radius:10px; padding:8px 12px; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:10px; color:#6b7280; font-weight:600; text-transform:uppercase; letter-spacing:1px;">💾 Last Save</span>
        <span style="font-size:11px;"><span style="color:#34d399;" id="save-src">—</span> / <span style="color:#f59e0b;" id="save-dst">—</span></span>
        <span style="font-size:10px; color:#4b5563;" id="save-info"></span>
      </div>
    </div>

    <div class="rate-bar">
      <span id="uptime">Uptime: —</span>
      <span id="speed">— it/s</span>
    </div>

    <div class="chart-container">
      <div class="chart-box">
        <div class="chart-title">Loss History</div>
        <canvas id="chart"></canvas>
      </div>
    </div>

    <div class="console-container">
      <div class="console-box" id="console"></div>
    </div>
  </div>

  <!-- Preview Tab -->
  <div id="tab-preview" class="tab-content">
    <div class="preview-container">
      <div class="preview-box">
        <div class="preview-header">
          <div class="preview-title">Training Preview</div>
          <div class="preview-view-name" id="preview-name">—</div>
        </div>
        <div class="preview-controls">
          <button class="preview-btn" id="btn-refresh" onclick="requestPreview()">
            🔄 Refresh
          </button>
          <button class="preview-btn" id="btn-next" onclick="nextPreview()">
            ◀▶ Next View
          </button>
          <button class="preview-btn" id="btn-zoom" onclick="toggleZoom()">
            🔍 Zoom
          </button>
        </div>
        <div class="preview-img-wrapper" id="preview-wrapper">
          <div class="preview-placeholder" id="preview-placeholder">
            <div class="icon">🖼️</div>
            Tap <b>Refresh</b> to load preview<br>
            <span style="font-size:11px; color:#374151;">One-shot generation — no continuous overhead</span>
          </div>
          <img id="preview-img" style="display:none;" alt="Training preview">
        </div>
        <div class="preview-timestamp" id="preview-time"></div>
      </div>
    </div>
  </div>

<script>
const srcEl = document.getElementById('src');
const dstEl = document.getElementById('dst');
const iterEl = document.getElementById('iter');
const srcDelta = document.getElementById('src-delta');
const dstDelta = document.getElementById('dst-delta');
const rateEl = document.getElementById('rate');
const uptimeEl = document.getElementById('uptime');
const speedEl = document.getElementById('speed');
const consoleEl = document.getElementById('console');
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');

let prevSrc = null, prevDst = null, prevIter = null, prevTime = null;
let previewLoading = false;
let previewZoomed = false;
let previewAutoRefresh = null;

// Tab switching
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-bar button').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  // Find the button that matches
  document.querySelectorAll('.tab-bar button').forEach(btn => {
    if ((tab === 'stats' && btn.textContent.includes('Stats')) ||
        (tab === 'preview' && btn.textContent.includes('Preview'))) {
      btn.classList.add('active');
    }
  });
  
  // When switching to preview tab, auto-load if no preview yet
  if (tab === 'preview') {
    const img = document.getElementById('preview-img');
    if (img.style.display === 'none') {
      loadPreviewImage();
    }
  }
}

function formatTime(s) {
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

function drawChart(history) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;

  ctx.clearRect(0, 0, W, H);

  if (history.length < 2) {
    ctx.fillStyle = '#4b5563';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Waiting for data...', W/2, H/2);
    return;
  }

  // Get min/max for scaling
  let minV = Infinity, maxV = -Infinity;
  for (const [it, src, dst] of history) {
    minV = Math.min(minV, src, dst);
    maxV = Math.max(maxV, src, dst);
  }
  const pad = (maxV - minV) * 0.1 || 0.01;
  minV -= pad; maxV += pad;

  const px = 30, py = 10;

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = py + (H - 2*py) * i / 4;
    ctx.beginPath(); ctx.moveTo(px, y); ctx.lineTo(W-5, y); ctx.stroke();
    ctx.fillStyle = '#4b5563';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText((maxV - (maxV-minV)*i/4).toFixed(3), px-4, y+3);
  }

  function drawLine(data, idx, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i < data.length; i++) {
      const x = px + (W - px - 5) * i / (data.length - 1);
      const y = py + (H - 2*py) * (1 - (data[i][idx] - minV) / (maxV - minV));
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  drawLine(history, 1, '#34d399');  // SRC
  drawLine(history, 2, '#f59e0b');  // DST

  // Legend
  ctx.font = '10px sans-serif';
  ctx.fillStyle = '#34d399'; ctx.fillText('● SRC', W-70, 14);
  ctx.fillStyle = '#f59e0b'; ctx.fillText('● DST', W-30, 14);
}

// ===== PREVIEW FUNCTIONS =====

function loadPreviewImage() {
  const img = document.getElementById('preview-img');
  const placeholder = document.getElementById('preview-placeholder');
  const nameEl = document.getElementById('preview-name');
  const timeEl = document.getElementById('preview-time');
  
  // Try to load current cached preview
  const newImg = new Image();
  newImg.onload = function() {
    img.src = newImg.src;
    img.style.display = 'block';
    placeholder.style.display = 'none';
    timeEl.textContent = 'Updated: ' + new Date().toLocaleTimeString();
  };
  newImg.onerror = function() {
    // No preview available
  };
  newImg.src = '/api/preview?t=' + Date.now();
}

function requestPreview() {
  const btn = document.getElementById('btn-refresh');
  if (previewLoading) return;
  
  previewLoading = true;
  btn.innerHTML = '<span class="spinner"></span> Generating...';
  btn.classList.add('loading');
  
  // Request preview generation from training thread
  fetch('/api/request_preview', { method: 'POST' })
    .then(() => {
      // Poll for the new preview (check every 2s, timeout after 30s)
      let attempts = 0;
      const poll = setInterval(() => {
        attempts++;
        const img = new Image();
        img.onload = function() {
          document.getElementById('preview-img').src = img.src;
          document.getElementById('preview-img').style.display = 'block';
          document.getElementById('preview-placeholder').style.display = 'none';
          document.getElementById('preview-time').textContent = 'Updated: ' + new Date().toLocaleTimeString();
          
          clearInterval(poll);
          previewLoading = false;
          btn.innerHTML = '🔄 Refresh';
          btn.classList.remove('loading');
        };
        img.onerror = function() {
          if (attempts >= 15) {
            clearInterval(poll);
            previewLoading = false;
            btn.innerHTML = '🔄 Refresh';
            btn.classList.remove('loading');
          }
        };
        img.src = '/api/preview?t=' + Date.now();
      }, 2000);
    })
    .catch(() => {
      previewLoading = false;
      btn.innerHTML = '🔄 Refresh';
      btn.classList.remove('loading');
    });
}

function nextPreview() {
  fetch('/api/next_preview', { method: 'POST' })
    .then(r => r.json())
    .then(data => {
      document.getElementById('preview-name').textContent = data.name || '—';
      // Reload the image
      loadPreviewImage();
    })
    .catch(() => {});
}

function toggleZoom() {
  const wrapper = document.getElementById('preview-wrapper');
  const btn = document.getElementById('btn-zoom');
  previewZoomed = !previewZoomed;
  if (previewZoomed) {
    wrapper.classList.add('zoomed');
    btn.innerHTML = '🔍 Fit';
  } else {
    wrapper.classList.remove('zoomed');
    btn.innerHTML = '🔍 Zoom';
  }
}

// ===== DATA REFRESH =====

async function refresh() {
  try {
    const resp = await fetch('/api/data');
    const data = await resp.json();

    srcEl.textContent = data.src.toFixed(4);
    dstEl.textContent = data.dst.toFixed(4);
    iterEl.textContent = (data.iter/1000).toFixed(1) + 'K';
    uptimeEl.textContent = 'Uptime: ' + formatTime(data.uptime);

    // Deltas
    if (prevSrc !== null) {
      const ds = data.src - prevSrc;
      srcDelta.textContent = (ds >= 0 ? '+' : '') + ds.toFixed(5);
      srcDelta.className = 'delta ' + (ds <= 0 ? 'delta-good' : 'delta-bad');
      const dd = data.dst - prevDst;
      dstDelta.textContent = (dd >= 0 ? '+' : '') + dd.toFixed(5);
      dstDelta.className = 'delta ' + (dd <= 0 ? 'delta-good' : 'delta-bad');
    }

    if (prevIter !== null && prevTime !== null) {
      const elapsed = (Date.now() - prevTime) / 1000;
      const its = (data.iter - prevIter) / elapsed;
      speedEl.textContent = its.toFixed(1) + ' it/s';
      rateEl.textContent = its.toFixed(1) + ' it/s';
    }

    prevSrc = data.src; prevDst = data.dst;
    prevIter = data.iter; prevTime = Date.now();

    // Last save info
    const saveBar = document.getElementById('save-bar');
    if (data.last_save) {
      saveBar.style.display = 'block';
      document.getElementById('save-src').textContent = data.last_save.src.toFixed(4);
      document.getElementById('save-dst').textContent = data.last_save.dst.toFixed(4);
      const ago = Math.floor((Date.now()/1000) - data.last_save.time);
      document.getElementById('save-info').textContent = `#${(data.last_save.iter/1000).toFixed(1)}K · ${formatTime(ago)} ago`;
    }

    // Chart
    drawChart(data.history);

    // Preview name update (if on preview tab)
    if (data.preview_names && data.preview_names.length > 0) {
      document.getElementById('preview-name').textContent = data.preview_names[data.preview_index] || '—';
    }

    // Console
    if (data.logs && data.logs.length > 0) {
      consoleEl.innerHTML = data.logs.map(([ts, text]) => {
        // Highlight loss values
        let html = text.replace(/\[(\d+\.\d+)\]/g, (m, v) => {
          const f = parseFloat(v);
          if (f < 0.3) return `[<span class="loss-src">${v}</span>]`;
          return `[${v}]`;
        });
        return `<div class="log-line">${html}</div>`;
      }).join('');
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }
  } catch(e) {}
}

refresh();
setInterval(refresh, 5000);
window.addEventListener('resize', () => { const d = document.getElementById('chart'); if(d) drawChart([]); });
</script>
</body>
</html>
